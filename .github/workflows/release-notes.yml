name: Publish release notes

# Distribution stays tag-driven. This workflow only creates the visible GitHub
# Release page (title and generated notes) for an existing vX.Y.Z tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish notes for (for example, v0.4.69)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Accept either "0.4.70" or "v0.4.70" and normalize to one leading v.
          TAG="${INPUT_TAG:-$REF_TAG}"
          TAG="v${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          git fetch --tags --force

          # Never overwrite curated notes. An existing release whose body is
          # only the automatic changelog link is treated as empty and filled.
          EXISTS=0
          if BODY=$(gh release view "$TAG" --json body -q .body 2>/dev/null); then
            if [[ -n "$(printf '%s\n' "$BODY" | grep -v '^\*\*Full Changelog\*\*' | tr -d '[:space:]')" ]]; then
              echo "Release $TAG already has notes; leaving it unchanged."
              exit 0
            fi
            echo "Release $TAG has no notes yet; filling them."
            EXISTS=1
          fi

          if PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null); then
            RANGE="$PREV..$TAG"
          else
            PREV=""
            RANGE="$TAG"
          fi

          # GitHub's generated notes only list merged pull requests. Changes
          # also land as direct commits on main, so use the commit list as a
          # fallback when there is nothing else to show.
          if [[ -n "$PREV" ]]; then
            NOTES=$(gh api "repos/$GH_REPO/releases/generate-notes" \
              -f tag_name="$TAG" -f previous_tag_name="$PREV" --jq .body)
          else
            NOTES=$(gh api "repos/$GH_REPO/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body)
          fi

          if [[ -z "$(printf '%s\n' "$NOTES" | grep -v '^\*\*Full Changelog\*\*' | tr -d '[:space:]')" ]]; then
            # shellcheck disable=SC2016  # %h stays literal for git, not bash
            NOTES=$(git log --no-merges --reverse --invert-grep \
              --grep='^Release [0-9]' --pretty='- %s (`%h`)' "$RANGE")
            if [[ -n "$PREV" ]]; then
              NOTES+=$'\n\n'"**Full Changelog**: https://github.com/${GH_REPO}/compare/${PREV}...${TAG}"
            else
              NOTES+=$'\n\n'"**Full Changelog**: https://github.com/${GH_REPO}/commits/${TAG}"
            fi
          fi

          if [[ "$EXISTS" == 1 ]]; then
            gh release edit "$TAG" --title "Plak $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --verify-tag \
              --title "Plak $TAG" \
              --notes "$NOTES"
          fi
